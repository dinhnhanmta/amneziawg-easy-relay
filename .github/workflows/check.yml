name: Installer checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n install.sh
          python3 -m py_compile installer.py
          python3 -m unittest discover -s tests -v
          python3 installer.py --help
          python3 - <<'PY'
          import hashlib, pathlib, re
          expected = re.search(r'INSTALLER_SHA256=([a-f0-9]{64})', pathlib.Path('install.sh').read_text())[1]
          assert hashlib.sha256(pathlib.Path('installer.py').read_bytes()).hexdigest() == expected
          PY
  out-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install OUT with real Docker, TUN and systemd
        run: |
          sudo modprobe tun
          sudo python3 installer.py --role out --out-host 192.0.2.10 --relay-host 192.0.2.20 --public-ui > /tmp/awge-install.log 2>&1 || {
            # Installer output contains a pairing secret: do not publish its log.
            echo 'OUT install failed; collecting only public service states'
            sudo grep -E '^(ERROR:|E:|Error response from daemon:|docker:)' /tmp/awge-install.log || true
            sudo docker ps -a --format '{{.Names}} {{.Status}}'
            sudo systemctl is-active docker awge-maintain.timer || true
            exit 1
          }
          sudo python3 installer.py --role status
          sudo docker restart awge-backhaul amnezia-wg-easy awge-panel-https > /dev/null
          sleep 10
          sudo python3 installer.py --role status
      - name: Rerun preserves identity and UI password
        run: |
          sudo sha256sum /opt/amnezia-easy-relay/backhaul/backhaul.conf /opt/amnezia-easy-relay/panel-password.txt > /tmp/before.sha
          sudo python3 installer.py --role out --out-host 192.0.2.10 --relay-host 192.0.2.20 --public-ui > /tmp/awge-rerun.log 2>&1
          sudo sha256sum -c /tmp/before.sha
          sudo python3 installer.py --role backup
